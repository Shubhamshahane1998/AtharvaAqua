name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloudflare builds `standalone`; Pages needs a static `out/` directory.
      NEXT_OUTPUT: export
      # Project sites live at /<repo>, and canonicals, sitemap and JSON-LD are
      # all derived from these two values. Change both together for a custom domain.
      NEXT_PUBLIC_BASE_PATH: /AtharvaAqua
      NEXT_PUBLIC_SITE_URL: https://shubhamshahane1998.github.io/AtharvaAqua
      # Cloudflare serves the copy that should rank. Two public copies of the
      # same pages compete, so this one asks search engines to skip it.
      NEXT_PUBLIC_NOINDEX: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Without this, GitHub Pages runs the output through Jekyll, which skips
      # every directory starting with an underscore — including _next.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
